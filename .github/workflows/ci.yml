name: Selenide UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # allows running the suite on demand from the Actions tab

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome, firefox ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Google Chrome
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@v1

      - name: Install Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1

      - name: Run tests (headless ${{ matrix.browser }})
        run: mvn test -Dselenide.browser=${{ matrix.browser }}
        env:
          CI: true   # triggers headless mode in BaseTest

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-${{ matrix.browser }}
          path: target/screenshots
          if-no-files-found: ignore

      - name: Load Allure history
        uses: actions/checkout@v4
        if: always() && matrix.browser == 'chrome'
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@master
        if: always() && matrix.browser == 'chrome'
        with:
          allure_results: target/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Publish Allure report to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        if: always() && matrix.browser == 'chrome'
        with:
          folder: allure-history
          branch: gh-pages

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t selenide-lab .

      - name: Run the suite inside the container
        run: |
          mkdir -p target
          docker run --rm --shm-size=2g -e CI=true \
            -v "$PWD/target:/app/target" \
            selenide-lab

      - name: Upload failure screenshots (docker)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-docker
          path: target/screenshots
          if-no-files-found: ignore

  notify-on-failure:
    needs: [ test, docker ]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL secret not set - skipping Slack notification"
            exit 0
          fi
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ Selenide UI Tests failed on \`$BRANCH\`. <$RUN_URL|View run>\"}" \
            "$SLACK_WEBHOOK_URL"
